<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <style>
    body {
      background-color: #121212;
      color: white;
    }
    .container {
      margin-top: 40px;
    }
    .event-image {
      max-height: 400px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4" id="eventTitle">Loading...</h1>
    <img id="eventImage" class="img-fluid event-image mb-4" src="" alt="Event Banner" />
    
    <p><strong>Date & Time:</strong> <span id="eventDateTime"></span></p>
    <p><strong>Location:</strong> <span id="eventLocation"></span></p>
    <p><strong>Status:</strong> <span id="eventStatus"></span></p>
    <hr>
    <p id="eventDescription"></p>
  </div>

<script>
  const CONFIG = {
    API_BASE_URL: "http://148.113.192.114:5000"
  };

  document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get("id");

    if (!eventId) {
      document.getElementById("eventTitle").textContent = "❌ No event ID provided.";
      return;
    }

    fetch(`${CONFIG.API_BASE_URL}/api/Event/get-event-by-id/${eventId}`)
      .then((res) => {
        if (!res.ok) throw new Error("Network response was not ok");
        return res.json();
      })
      .then((event) => {
        document.getElementById("eventTitle").textContent = event.title;
        document.getElementById("eventImage").src = event.template_path || '';
        document.getElementById("eventDateTime").textContent = new Date(event.start_datetime).toLocaleString();
        document.getElementById("eventLocation").textContent = event.location;
        document.getElementById("eventStatus").textContent = event.status;
        document.getElementById("eventDescription").textContent = event.description || "No description available.";
      })
      .catch((err) => {
        document.getElementById("eventTitle").textContent = "❌ Failed to load event.";
        console.error("Error loading event:", err);
      });
  });
</script>

</body>
</html>
