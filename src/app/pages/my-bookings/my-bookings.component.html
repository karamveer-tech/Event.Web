<div class="scroll-container">

  <!-- ==========Banner-Section========== -->
<section class="banner-section" style="padding-bottom: 100px !important;">
    <div class="banner-bg bg-fixed" style="background:url('img/banner/banner-event.jpg')"></div>
    <div class="container">
        <div class="banner-content">
            <h1 class="title bold"> <span class="color-theme">My</span> Bookings</h1>
        </div>
    </div>
</section>
<!-- ==========Banner-Section========== -->
<section class="movie-section bg-two">
  <div class="container mt-4">
    <div class="row d-flex justify-content-center">
      <div class="col-md-12 col-lg-12 mb-12" *ngFor="let event of myBookings">
        <div class="card h-100 shadow-sm">

          <!-- Banner on top -->
          <img [src]="event.banner_path" 
               class="card-img-top img-fluid"
               style="height:250px; object-fit:cover; width:100%;" 
               alt="Event Banner">

          <!-- Content below banner -->
          <div class="card-body">
            <div class="row">
              
              <!-- Left side: Event details -->
              <div class="col-md-6">
                <h5 class="card-title">{{ event.title }}</h5>
                <p class="card-text">{{ event.description }}</p>
                <p class="mb-1"><strong>Location:</strong> {{ event.location | uppercase }}</p>
                <p class="mb-1"><strong>Start:</strong> {{ event.start_datetime | date: 'medium' }}</p>
                <p class="mb-1"><strong>End:</strong> {{ event.end_datetime | date: 'medium' }}</p>
                 <p class="mb-1"><strong>Total Tickets:</strong> {{ event.quantity}}</p>
                <p *ngIf="event.ticketType"><strong>Ticket Type:</strong> {{ event.ticketType }}</p>
              </div>
              <!-- Right side: QR & MAP -->
              <div class="col-md-6 d-flex justify-content-center align-items-center">
                <div class="row w-100">
                  <div class="col-6 text-center border p-3">
                    <strong>QR</strong>
                    <!-- Add QR image here -->
                    <!-- <img src="./assets/img/event/qr-sample.png" alt="QR Code" class="img-fluid mt-2"> -->

                    <!-- <a [routerLink]="['/qr']" [queryParams]="{ data: 'https://google.com' }">
                        Generate QR for Google
                      </a>

                      <br /> -->
                  <qrcode
                      [qrdata]="'http://148.113.192.114/get-event-by-id/' + event.event_id"
                      [width]="128"
                      [errorCorrectionLevel]="'M'">
                    </qrcode>
                  </div>
                  <div class="col-6 text-center border p-3">
                    <strong>MAP</strong>
                    <!-- Add Map image/iframe here -->
                    <img src="./assets/img/event/map-sample.JPG" alt="Map" class="img-fluid mt-2">
                  </div>
                </div>
              </div>
              <div class="mt-auto">
                <button class="btn btn-sm btn-success w-100" (click)="shareEventDetails(event.id)">
                  Share Details
                </button>
              </div>
            </div>
          </div>
       </div>
      </div>
    </div>
  </div>
</section>

 </div>
<!-- ==========Event-Section========== -->
